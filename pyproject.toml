[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bizdata"
version = "0.1.0"
description = "MCP server and small Claude agent over a store's SQLite database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "anthropic>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bizdata-mcp = "bizdata.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
